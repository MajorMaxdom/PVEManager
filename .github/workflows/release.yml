name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - run: go test ./...
      - name: Build web UI
        run: npm ci && npm run build
        working-directory: web/app
      - name: Build binaries
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" \
              -o dist/pve-manager-linux-$arch ./cmd/pve-manager
          done
          tar czf dist/pve-manager-deploy.tar.gz -C deploy install.sh uninstall.sh onboard-pve-host.sh install.example.conf
          cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
