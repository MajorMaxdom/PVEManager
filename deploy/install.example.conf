# pve-manager installer configuration.  Usage: sudo ./install.sh --config install.conf
# Every key is optional; missing keys are asked interactively (or defaulted with --yes).

# Address the web UI listens on
LISTEN=0.0.0.0:8443
# Name used in the self-signed certificate
HOSTNAME_FQDN=manager.example.net
# TLS: selfsigned | files | off (off = behind a TLS-terminating reverse proxy)
TLS_MODE=selfsigned
#TLS_CERT=/etc/ssl/certs/pve-manager.crt
#TLS_KEY=/etc/ssl/private/pve-manager.key

# First admin account. If ADMIN_PASSWORD_FILE is empty a password is generated and shown once.
ADMIN_USER=admin
#ADMIN_PASSWORD_FILE=/root/pve-manager-admin.pw

# PVE server definitions (written by onboard-pve-host.sh), space separated, imported at install time.
# More servers can be added later: pve-manager server add -file X.yaml
#SERVER_FILES="./servers.d/pve1.yaml ./servers.d/pve2.yaml"
